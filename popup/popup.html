<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>CleanXLink</title>
  <style>
    :root { --bg:#fff; --fg:#0f1419; --mut:#536471; --line:#eff3f4; --acc:#1d9bf0; --box:#f7f9f9; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15202b; --fg:#e7e9ea; --mut:#8b98a5; --line:#38444d; --box:#1e2732; } }
    * { box-sizing: border-box; }
    body { margin:0; width:320px; font:13px/1.4 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:12px 14px; border-bottom:1px solid var(--line); font-weight:700; font-size:15px; }
    section { padding:10px 14px; border-bottom:1px solid var(--line); }
    h2 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
    label.row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
    select { font:inherit; padding:3px 6px; border-radius:6px; border:1px solid var(--line); background:var(--box); color:var(--fg); max-width:170px; }
    input[type=checkbox] { accent-color:var(--acc); width:16px; height:16px; }
    .preview { background:var(--box); border-radius:8px; padding:8px; font:12px/1.4 ui-monospace, Consolas, monospace; word-break:break-all; }
    .preview .from { color:var(--mut); }
    footer { padding:8px 14px; color:var(--mut); font-size:11px; }
  </style>
</head>
<body>
  <header>CleanXLink</header>

  <section>
    <h2>Chung</h2>
    <label class="row">Bỏ tham số theo dõi <input type="checkbox" id="stripTracking" checked></label>
    <label class="row">Đổi link sang dạng embed (Fixups) <input type="checkbox" id="fixup" checked></label>
  </section>

  <section>
    <h2>X / Twitter</h2>
    <label class="row">Tên miền
      <select id="xDomain">
        <option value="fxtwitter.com" selected>fxtwitter.com</option>
        <option value="fixupx.com">fixupx.com</option>
        <option value="x.com">x.com (giữ nguyên)</option>
      </select>
    </label>
    <label class="row">Kiểu embed
      <select id="style">
        <option value="" selected>Đầy đủ</option>
        <option value="d">d. — Link media trực tiếp</option>
        <option value="g">g. — Gallery (media + tác giả)</option>
        <option value="t">t. — Chỉ chữ</option>
        <option value="m">m. — Ghép nhiều ảnh</option>
        <option value="i">i. — Telegram Instant View</option>
        <option value="o">o. — Embed Discord kiểu cũ</option>
      </select>
    </label>
    <label class="row">Dịch nội dung
      <select id="translate">
        <option value="" selected>Không dịch</option>
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </label>
  </section>

  <section>
    <h2>Trang khác</h2>
    <label class="row">Bluesky → fxbsky.app <input type="checkbox" id="bsky" checked></label>
    <label class="row">Reddit → vxreddit.com <input type="checkbox" id="reddit" checked></label>
  </section>

  <section>
    <h2>Xem trước</h2>
    <div class="preview">
      <div class="from">https://x.com/fxembed/status/1830000000000000000?s=20&amp;t=abc</div>
      <div id="out"></div>
    </div>
  </section>

  <footer>Kiểu embed và dịch cũng áp dụng cho Bluesky. Tải lại tab sau khi đổi nếu chưa thấy hiệu lực.</footer>
  <script src="popup.js"></script>
</body>
</html>
